name: Build GeoWorld

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  # ── Windows build ────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package (zip exe + assets)
        run: |
          mkdir GeoWorld-Windows
          copy build\Release\GeoWorld.exe GeoWorld-Windows\
          xcopy /E /I assets GeoWorld-Windows\assets
          Compress-Archive -Path GeoWorld-Windows -DestinationPath GeoWorld-Windows.zip
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoWorld-Windows
          path: GeoWorld-Windows.zip

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: GeoWorld-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Linux build ──────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package (tar.gz binary + assets)
        run: |
          mkdir GeoWorld-Linux
          cp build/GeoWorld GeoWorld-Linux/
          cp -r assets GeoWorld-Linux/
          tar -czf GeoWorld-Linux.tar.gz GeoWorld-Linux/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoWorld-Linux
          path: GeoWorld-Linux.tar.gz

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: GeoWorld-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
